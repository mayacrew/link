<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>얼짱캠 2003 — 다운로드</title>
<meta name="description" content="2003년으로 돌아가는 얼짱캠. 뽀샤시 소프트 필터, 픽셀 하트, 날짜 도장까지 그때 그 감성 그대로." />

<!-- Open Graph (인스타·카톡 공유 미리보기) -->
<meta property="og:type" content="website" />
<meta property="og:title" content="얼짱캠 2003 — Y2K 뽀샤시" />
<meta property="og:description" content="내 폰이 2003년 웹캠으로. 앱 다운로드하기 →" />
<meta property="og:image" content="appicon.png" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="appicon.png" />

<!-- ───────── 방문자 분석 (선택) ─────────
     Umami Cloud 가입 후 아래 주석을 풀고 data-website-id만 바꾸면
     페이지뷰 + 아래 버튼 클릭 이벤트가 자동으로 집계됩니다.
<script defer src="https://cloud.umami.is/script.js"
        data-website-id="여기에-사이트-ID"></script>
────────────────────────────────────── -->

<style>
  :root{
    --pink:#ff5fa2; --pink-d:#e02f7f; --blue:#5fd0ff; --cream:#fff6fb;
    --ink:#3b2233;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",
                "Malgun Gothic",system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 15% -10%, #ffd9ec 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, #d6f0ff 0%, transparent 55%),
      linear-gradient(180deg,#fff9fc 0%, #f6ecff 55%, #eaf6ff 100%);
    min-height:100dvh;
    display:flex; align-items:center; justify-content:center;
    padding:28px 18px 40px;
  }
  /* 반짝이 배경 */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; opacity:.5;
    background-image:
      radial-gradient(2px 2px at 12% 22%, #fff 50%, transparent 51%),
      radial-gradient(2px 2px at 78% 14%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 34% 76%, #fff 50%, transparent 51%),
      radial-gradient(2px 2px at 88% 62%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 58% 40%, #fff 50%, transparent 51%);
  }
  .card{
    position:relative; width:100%; max-width:400px; text-align:center;
    background:rgba(255,255,255,.72);
    border:2px solid #fff;
    border-radius:26px;
    padding:30px 22px 26px;
    box-shadow:0 18px 50px rgba(214,120,170,.28), 0 2px 0 #fff inset;
    backdrop-filter:blur(10px);
  }
  .icon{
    width:96px;height:96px;border-radius:24px;display:block;margin:0 auto 14px;
    box-shadow:0 10px 26px rgba(224,47,127,.3);
  }
  h1{font-size:22px;margin:0 0 6px;letter-spacing:-.4px}
  .sub{font-size:13.5px;line-height:1.65;color:#7a5c6e;margin:0 0 22px}
  .hearts{font-size:13px;letter-spacing:3px;color:var(--pink);margin-bottom:16px}

  .btn{
    display:flex;align-items:center;gap:12px;justify-content:center;
    width:100%; padding:15px 18px; margin-bottom:11px;
    border-radius:16px; text-decoration:none; font-size:15.5px; font-weight:700;
    border:2px solid transparent; transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{transform:scale(.975)}
  .btn svg{width:20px;height:20px;flex:none}
  .btn-ios{background:linear-gradient(135deg,#2b2b2f,#111);color:#fff;
           box-shadow:0 8px 22px rgba(0,0,0,.22)}
  .btn-and{background:linear-gradient(135deg,#fff,#f4f7ff);color:#1f2937;
           border-color:#dfe6f5; box-shadow:0 8px 22px rgba(90,120,190,.16)}
  .btn .tag{
    margin-left:6px;font-size:10.5px;font-weight:800;letter-spacing:.3px;
    padding:3px 8px;border-radius:999px;background:var(--pink);color:#fff;
  }
  .btn-and .tag{background:var(--blue);color:#06364a}
  .btn[hidden]{display:none}

  /* ── 앱스토어식 미리보기 캐러셀 ── */
  .shots{
    display:flex; gap:12px; overflow-x:auto; margin:22px -22px 0; padding:4px 22px 14px;
    scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .shots::-webkit-scrollbar{display:none}
  .shots img{
    flex:none; width:158px; aspect-ratio:9/16; object-fit:cover;
    border-radius:16px; border:3px solid #fff; scroll-snap-align:center;
    box-shadow:0 10px 26px rgba(150,120,180,.25);
  }
  .dots{display:flex;justify-content:center;gap:6px;margin-top:2px}
  .dots i{width:6px;height:6px;border-radius:50%;background:#e5cfe0;transition:.2s}
  .dots i.on{background:var(--pink);width:16px;border-radius:3px}
</style>
</head>
<body>
<main class="card">
  <img class="icon" src="appicon.png" alt="얼짱캠 2003" />
  <h1>얼짱캠 2003</h1>
  <p class="sub">
    내 폰이 2003년 웹캠으로 ✧<br />
    뽀샤시 소프트 필터 · 픽셀 하트 · 날짜 도장
  </p>
  <div class="hearts">♡ ♥ ♡ ♥ ♡</div>

  <a id="btn-ios" class="btn btn-ios" href="#" rel="noopener">
    <svg viewBox="0 0 384 512" fill="currentColor"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
    App Store<span class="tag" id="tag-ios" hidden>추천</span>
  </a>

  <a id="btn-and" class="btn btn-and" href="#" rel="noopener">
    <svg viewBox="0 0 512 512" fill="currentColor"><path d="M325.3 234.3 104.6 13l280.8 161.2-60.1 60.1zM47 0C34 6.8 25.3 19.2 25.3 35.3v441.3c0 16.1 8.7 28.5 21.7 35.3l256.6-256L47 0zm425.2 225.6-58.9-34.1-65.7 64.5 65.7 64.5 60.1-34.1c18-14.3 18-46.5-1.2-60.8zM104.6 499l280.8-161.2-60.1-60.1L104.6 499z"/></svg>
    Google Play<span class="tag" id="tag-and" hidden>추천</span>
  </a>

  <div class="shots" id="shots">
    <img src="shot1.jpg" alt="앱 미리보기 1" />
    <img src="shot2.jpg" alt="앱 미리보기 2" loading="lazy" />
    <img src="shot3.jpg" alt="앱 미리보기 3" loading="lazy" />
    <img src="shot4.jpg" alt="앱 미리보기 4" loading="lazy" />
    <img src="shot5.jpg" alt="앱 미리보기 5" loading="lazy" />
    <img src="shot6.jpg" alt="앱 미리보기 6" loading="lazy" />
  </div>
  <div class="dots" id="dots"></div>
</main>

<script>
/* ══════════════════════════════════════════════════════════
   설정 — 여기만 고치면 됩니다
   ══════════════════════════════════════════════════════════ */
const CONFIG = {
  iosAppId:   '6787339271',
  androidPkg: 'com.mayacrew.haduricam',

  // App Store Connect → 사용자 및 액세스 → (하단) Provider ID.
  // 채워 넣으면 App Store Connect의 App Analytics > 캠페인에서
  // 이 링크로 들어온 실제 설치 수를 볼 수 있습니다. 비워두면 그냥 일반 링크.
  appleProviderId: '',

  // 기본 유입 출처. 링크 뒤에 ?src=tiktok 처럼 붙이면 그 값으로 바뀝니다.
  defaultSource: 'instagram',
  campaign: 'bio_link',
};

/* ── 유입 출처 (인스타/틱톡/유튜브 등 구분용) ── */
const src = (new URLSearchParams(location.search).get('src') || CONFIG.defaultSource)
              .replace(/[^a-z0-9_-]/gi, '').slice(0, 20) || 'direct';

/* ── App Store 링크 (pt = Provider ID, ct = 캠페인 라벨, 최대 40자) ── */
function iosUrl() {
  const p = new URLSearchParams();
  if (CONFIG.appleProviderId) p.set('pt', CONFIG.appleProviderId);
  p.set('ct', (src + '_' + CONFIG.campaign).slice(0, 40));
  p.set('mt', '8');
  return `https://apps.apple.com/kr/app/id${CONFIG.iosAppId}?${p}`;
}

/* ── Google Play 링크 ──
   referrer 값은 반드시 통째로 URL 인코딩해야 UTM이 살아남습니다.
   Play Console → 획득 보고서 → 스토어 유입경로 에서 확인. */
function andUrl() {
  const referrer = `utm_source=${src}&utm_medium=bio&utm_campaign=${CONFIG.campaign}`;
  return `https://play.google.com/store/apps/details?id=${CONFIG.androidPkg}`
       + `&referrer=${encodeURIComponent(referrer)}`;
}

const btnIos = document.getElementById('btn-ios');
const btnAnd = document.getElementById('btn-and');
btnIos.href = iosUrl();
btnAnd.href = andUrl();

/* ── OS 감지: 자동 이동은 하지 않고, 맞는 쪽에 "추천" 배지만 ── */
const ua = navigator.userAgent;
const isIOS = /iPad|iPhone|iPod/.test(ua) || (ua.includes('Mac') && 'ontouchend' in document);
const isAnd = /Android/.test(ua);
if (isIOS) { document.getElementById('tag-ios').hidden = false; btnIos.parentNode.prepend(btnIos); }
if (isAnd) { document.getElementById('tag-and').hidden = false; btnAnd.parentNode.prepend(btnAnd); }

/* ── 클릭 집계 ──
   페이지를 떠나면서 보내는 요청이라 sendBeacon / keepalive 를 써야
   중간에 잘리지 않습니다. Umami를 붙였으면 자동으로 이벤트가 남습니다. */
function track(store) {
  try {
    if (window.umami) window.umami.track('click_' + store, { source: src });
    if (window.gtag)  window.gtag('event', 'store_click', { store, source: src });
  } catch (e) {}
}
btnIos.addEventListener('click', () => track('ios'));
btnAnd.addEventListener('click', () => track('android'));

/* ── 미리보기 캐러셀 인디케이터 ── */
const shots = document.getElementById('shots');
const dots  = document.getElementById('dots');
[...shots.children].forEach(() => dots.appendChild(document.createElement('i')));
function syncDots() {
  const i = Math.round(shots.scrollLeft / (shots.scrollWidth / shots.children.length));
  [...dots.children].forEach((d, n) => d.classList.toggle('on', n === i));
}
shots.addEventListener('scroll', syncDots, { passive: true });
syncDots();

/* 접속 로그 (개발용) */
console.log('[link] source =', src);
</script>
</body>
</html>
